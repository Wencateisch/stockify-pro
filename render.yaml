services:
  - type: web
    name: stockify-pro-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REFRESH_MS
        value: 15000
      - key: CORS_ORIGIN
        value: https://wencateisch.github.io
