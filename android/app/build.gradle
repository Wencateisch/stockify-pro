plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Optional: point the app at a hosted backend at build time with
//   ./gradlew assembleDebug -PstockifyServerUrl=https://your-api.example.com
// Leave empty to ship the built-in demo feed (default).
def stockifyServerUrl = (project.findProperty('stockifyServerUrl') ?: '').toString()

android {
    namespace 'com.stocktrading'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stocktrading'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + stockifyServerUrl + '"'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Live feed (optional). org.json ships with Android, so exclude the bundled copy.
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }
}
