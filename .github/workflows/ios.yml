name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install web dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        working-directory: app
        run: npm run build

      - name: Sync Capacitor iOS project
        working-directory: app
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for the simulator (no signing)
        working-directory: app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload simulator build (needs Xcode to run)
        uses: actions/upload-artifact@v4
        with:
          name: StockifyPro-iOS-simulator
          path: app/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: warn
