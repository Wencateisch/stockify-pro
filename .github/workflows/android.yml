name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StockifyPro-debug.apk
          ls -lh StockifyPro-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockifyPro-debug
          path: StockifyPro-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stockify Pro ${{ github.ref_name }}
          files: StockifyPro-debug.apk
          generate_release_notes: true
          body: |
            Installable Android build of Stockify Pro.

            **Install**
            1. Download `StockifyPro-debug.apk` below on your Android phone.
            2. Open the file and allow "Install unknown apps" when prompted.
            3. Launch Stockify Pro — it runs on a built-in demo market feed.

            **Use the live backend (optional)**
            Start `backend/` (`npm install && npm start`), then tap the status
            chip in the app and enter the server URL (e.g. `http://192.168.1.20:3001`
            on your local network).

            Simulated market data only — not investment advice.
