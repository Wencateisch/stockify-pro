name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install web dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build web bundle
        working-directory: app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: app
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk StockifyPro-android.apk
          ls -lh StockifyPro-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockifyPro-android
          path: StockifyPro-android.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stockify Pro ${{ github.ref_name }}
          files: StockifyPro-android.apk
          generate_release_notes: true
          body: |
            ### Stockify Pro — Nifty 50 day-trading desk (paper only)

            **Install on Android**
            1. Download `StockifyPro-android.apk` below.
            2. Open it and allow "Install unknown apps" when Android asks.
            3. Launch Stockify Pro. It boots on the bundled real NSE snapshot
               (17 Nov 2026, 5-minute bars + 90 daily bars for all 50 names).

            **Live ticker (optional)**
            Run `backend/` (`npm install && npm start`) and point
            **Settings → Server URL** at it. The proxy streams real Yahoo
            Finance quotes for the same 50 tickers; no prices are simulated.

            **No account, no broker, no money.** Every fill is paper and stays
            on the device. Education and tooling, not investment advice.

            Web build: https://wencateisch.github.io/stockify-pro/
